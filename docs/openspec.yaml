openapi: 3.1.0
info:
  title: TaskPulse API & Services OpenSpec
  description: |
    Especificación formal OpenSpec / OpenAPI 3.1 para la arquitectura de TaskPulse,
    con esquema de datos 100% en español ('tareas'), gestión de autenticación,
    políticas RLS y servicios de integración con Supabase.
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo Taller IA
servers:
  - url: https://your-project.supabase.co
    description: Supabase Cloud API Gateway (Producción)
  - url: http://localhost:3000/api
    description: Servidor Local Next.js

paths:
  /auth/v1/signup:
    post:
      summary: Registro de nuevo usuario
      description: Crea una nueva cuenta de usuario en Supabase Auth mediante email y contraseña.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesAutenticacion'
      responses:
        '200':
          description: Usuario registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAutenticacion'
        '400':
          description: Credenciales inválidas o correo ya existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'

  /auth/v1/token?grant_type=password:
    post:
      summary: Inicio de sesión (Login)
      description: Autentica un usuario existente y retorna un JSON Web Token (JWT) con el rol autenticado.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesAutenticacion'
      responses:
        '200':
          description: Sesión iniciada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAutenticacion'
        '400':
          description: Correo o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'

  /rest/v1/tareas:
    get:
      summary: Listar tareas del usuario
      description: Obtiene las tareas pertenecientes al usuario autenticado (filtradas automáticamente por RLS).
      tags:
        - Tareas
      security:
        - BearerAuth: []
      parameters:
        - name: select
          in: query
          description: Campos a proyectar
          schema:
            type: string
            default: '*'
        - name: completada
          in: query
          description: Filtrar por estado completado
          schema:
            type: string
            enum: ['eq.true', 'eq.false']
        - name: prioridad
          in: query
          description: Filtrar por prioridad
          schema:
            type: string
            enum: ['eq.baja', 'eq.media', 'eq.alta']
        - name: order
          in: query
          description: Orden de resultados
          schema:
            type: string
            default: 'creado_en.desc'
      responses:
        '200':
          description: Lista de tareas recuperadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarea'
        '401':
          description: No autorizado (Token JWT faltante o expirado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'

    post:
      summary: Crear una nueva tarea
      description: Inserta una tarea asociada al `auth.uid()` del usuario autenticado.
      tags:
        - Tareas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearTareaEntrada'
      responses:
        '201':
          description: Tarea creada satisfactoriamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '400':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'

  /rest/v1/tareas?id=eq.{id}:
    patch:
      summary: Actualizar una tarea
      description: Modifica título, descripción, prioridad o estado completado de una tarea propia.
      tags:
        - Tareas
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID de la tarea
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarTareaEntrada'
      responses:
        '200':
          description: Tarea actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '404':
          description: Tarea no encontrada o no pertenece al usuario.

    delete:
      summary: Eliminar una tarea
      description: Borra permanentemente una tarea por su ID si pertenece al usuario actual.
      tags:
        - Tareas
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID de la tarea
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tarea eliminada sin contenido.
        '404':
          description: Tarea no encontrada o no pertenece al usuario.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de autenticación de Supabase (JWT)

  schemas:
    Tarea:
      type: object
      required:
        - id
        - usuario_id
        - titulo
        - completada
        - prioridad
        - creado_en
        - actualizado_en
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        usuario_id:
          type: string
          format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        titulo:
          type: string
          example: "Completar la lección de Inteligencia Artificial"
        descripcion:
          type: string
          nullable: true
          example: "Revisar arquitectura en capas y pruebas en Supabase"
        prioridad:
          type: string
          enum: [baja, media, alta]
          example: "alta"
        completada:
          type: boolean
          example: false
        creado_en:
          type: string
          format: date-time
          example: "2026-09-11T18:00:00Z"
        actualizado_en:
          type: string
          format: date-time
          example: "2026-09-11T18:00:00Z"

    CrearTareaEntrada:
      type: object
      required:
        - titulo
      properties:
        titulo:
          type: string
          minLength: 1
          example: "Nueva tarea en español"
        descripcion:
          type: string
          example: "Detalles adicionales"
        prioridad:
          type: string
          enum: [baja, media, alta]
          default: media

    ActualizarTareaEntrada:
      type: object
      properties:
        titulo:
          type: string
        descripcion:
          type: string
        prioridad:
          type: string
          enum: [baja, media, alta]
        completada:
          type: boolean

    CredencialesAutenticacion:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "usuario@ejemplo.com"
        password:
          type: string
          format: password
          minLength: 6
          example: "SuperClave123!"

    RespuestaAutenticacion:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          example: 3600
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string

    ErrorApi:
      type: object
      properties:
        code:
          type: string
          example: "PGRST301"
        message:
          type: string
          example: "JWT expirado o inválido"
